      /* 首屏加载提示：内联样式 + 纯 HTML，网络再慢也能立刻显示，
         不会像原来那样"深色底 + 无内容"让人以为站点挂了 */
      .boot-hint {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        gap: 10px; background: #080818; color: #8a9abe;
        font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.05em;
      }
      .boot-hint .dot {
        width: 8px; height: 8px; border-radius: 50%; background: #00f5ff;
        animation: bootpulse 1.2s ease-in-out infinite;
      }
      @keyframes bootpulse { 0%, 100% { opacity: .25; transform: scale(.8) } 50% { opacity: 1; transform: scale(1) } }
    </style>
