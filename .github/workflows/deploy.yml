name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 数据完整性校验 + 单测：把"首页卡片指向不存在的文章""KB 快照漂移""映射表漏项"
      # 这类问题拦在部署之前（npm run check 里的 kb 部分在没有本地 vault 时会自动跳过源文件比对）
      - name: Check data & run tests
        working-directory: frontend
        run: npm run check && npm test

      - name: Build frontend
        working-directory: frontend
        # 构建期开关：
        #
        # ① 云服务地址 → 已改由 **frontend/.env.production** 提供（版本化在仓库里，改了就走）。
        #    现在指向自建的 WorkBuddy 托管中转（frontend/relay/，国内可达）。
        #    ⚠️ 不再用仓库变量控制：变量"设了就长期生效"，一旦设成失效地址（如被墙的
        #       workers.dev）会静默地把请求指歪、且没人会去看。若 Settings → Variables 里
        #       还留着 VITE_CLOUD_ENDPOINT，现在是**无效**的，建议删掉免得误导。
        #
        # ② 人机校验（Cloudflare Turnstile）
        #    · 控制台 → Turnstile 建站点，拿到 site key / secret
        #    · 这里加 Variables：VITE_TURNSTILE_SITE_KEY = <site key>
        #    · 中转那边配 secret：见 frontend/relay/（TURNSTILE_SECRET 环境变量）
        #    · ⚠️ 两边必须一起配：只配前端 → 校验被跳过（不报错也不设防）；
        #      只配中转 → 访客拿不到 token，写操作全部 403
        #    · 不设 → 挂件整体不渲染，站点行为与之前完全一样
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          # 不要 force_orphan：它会把 gh-pages 上**上一次部署的产物全删掉**。
          # 后果：访客浏览器缓存的旧入口包，其引用的 vendor 分包（带哈希）直接 404
          # → 应用启动不了 → 首页一直卡在加载态（实测复现：旧哈希的 react-vendor-*.js 返回 404）。
          # 保留历史文件后，旧页面也能继续跑，只是版本旧一点，不会白屏。
