name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# 最小权限：默认只读，写权限只在真正要推 gh-pages 的那一步给。
# （2026-11-09 审计：原来在 workflow 级给 contents: write，任何步骤都能推仓库。）
permissions:
  contents: read

# 同一时间只跑一个部署；后 push 的排队而不是被取消，避免旧构建最后覆盖新构建。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 只有这个作业需要写（推 gh-pages）；写权限收窄到作业级，不放到 workflow 级
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 数据完整性校验 + 单测：把"首页卡片指向不存在的文章""KB 快照漂移""映射表漏项"
      # 这类问题拦在部署之前（npm run check 里的 kb 部分在没有本地 vault 时会自动跳过源文件比对）
      - name: Check data & run tests
        working-directory: frontend
        run: npm run check && npm test

      - name: Build frontend
        working-directory: frontend
        # 构建期开关：
        #
        # ① 云服务地址 → 已改由 **frontend/.env.production** 提供（版本化在仓库里，改了就走）。
        #    现在指向自建的 WorkBuddy 托管中转（frontend/relay/，国内可达）。
        #    ⚠️ 不再用仓库变量控制：变量"设了就长期生效"，一旦设成失效地址（如被墙的
        #       workers.dev）会静默地把请求指歪、且没人会去看。若 Settings → Variables 里
        #       还留着 VITE_CLOUD_ENDPOINT，现在是**无效**的，建议删掉免得误导。
        #
        # ② 人机校验（Cloudflare Turnstile）
        #    · site key 是公开值，已放在 **frontend/.env.production**（版本化，和云地址同一套机制）
        #    · secret 只在掉端运行环境：frontend/relay/.env 的 TURNSTILE_SECRET，不进仓库
        #    · ⚠️ 不要再在 workflow 里用 Variables 覆盖 VITE_TURNSTILE_SITE_KEY：
        #      未设置时变量会展开成空串，反而把 .env.production 里的值盖掉（2026-11-08 实测踩过）。
        #    · 两边必须一起配：只配前端 → 校验被跳过；只配中转 → 访客拿不到 token，发码全部 403
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          # 关键：不加 keep_files 时，action 会删除 gh-pages 上上一版的全部文件
          #（实测上一次部署的 17 个旧哈希 chunk 被删）。
          # 缓存窗口内旧 index.html 引用的 chunk 会 404 → 白屏。keep_files: true 保留旧文件。
          keep_files: true
          # 不要 force_orphan：它会把 gh-pages 上**上一次部署的产物全删掉**。
          # 后果：访客浏览器缓存的旧入口包，其引用的 vendor 分包（带哈希）直接 404
          # → 应用启动不了 → 首页一直卡在加载态（实测复现：旧哈希的 react-vendor-*.js 返回 404）。
          # 保留历史文件后，旧页面也能继续跑，只是版本旧一点，不会白屏。
