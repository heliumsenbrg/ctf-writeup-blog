name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 数据完整性校验 + 单测：把"首页卡片指向不存在的文章""KB 快照漂移""映射表漏项"
      # 这类问题拦在部署之前（npm run check 里的 kb 部分在没有本地 vault 时会自动跳过源文件比对）
      - name: Check data & run tests
        working-directory: frontend
        run: npm run check && npm test

      - name: Build frontend
        working-directory: frontend
        # 两个构建期开关，都通过仓库 Variables 传（不用改代码）：
        #
        # ① 云服务同源中转（Cloudflare Worker，见 frontend/cloudflare/）
        #    · 部署 Worker：cd frontend/cloudflare && wrangler deploy —— 它会打印 workers.dev 地址
        #    · Settings → Secrets and variables → Actions → **Variables** 加：
        #        VITE_CLOUD_ENDPOINT = https://ctf-blog-cloud-proxy.<你的子域>.workers.dev
        #    · 不设 → 前端回退直连云服务（GitHub Pages 上会被 Origin 白名单拒，留言/评论不可用）
        #
        # ② 人机校验（Cloudflare Turnstile）
        #    · 控制台 → Turnstile 建站点，拿到 site key / secret
        #    · 这里加 Variables：VITE_TURNSTILE_SITE_KEY = <site key>
        #    · Worker 那边配 secret：cd frontend/cloudflare && wrangler secret put TURNSTILE_SECRET
        #    · ⚠️ 两边必须一起配：只配前端 → 校验被跳过（不报错也不设防）；
        #      只配 Worker → 访客拿不到 token，写操作全部 403
        #    · 不设 → 挂件整体不渲染，站点行为与之前完全一样
        #
        # 想退回去：删掉对应变量即可。
        env:
          VITE_CLOUD_ENDPOINT: ${{ vars.VITE_CLOUD_ENDPOINT }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          # 不要 force_orphan：它会把 gh-pages 上**上一次部署的产物全删掉**。
          # 后果：访客浏览器缓存的旧入口包，其引用的 vendor 分包（带哈希）直接 404
          # → 应用启动不了 → 首页一直卡在加载态（实测复现：旧哈希的 react-vendor-*.js 返回 404）。
          # 保留历史文件后，旧页面也能继续跑，只是版本旧一点，不会白屏。
